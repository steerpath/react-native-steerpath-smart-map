apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

/**
 * React Native Configuration
 */
react {    
    hermesEnabled = true
}

/**
 * Set this to true to create separate APKs per CPU architecture.
 */
def enableSeparateBuildPerCPUArchitecture = false

/**
 * Run Proguard to shrink the Java bytecode in release builds.
 */
def enableProguardInReleaseBuilds = false

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion
    namespace "com.example" // Mandatory in 2026

    defaultConfig {
        applicationId "com.example"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    
    // The architecture filtering logic is now handled automatically by the 
    // reactNativeArchitectures property in gradle.properties
}

dependencies {
    // Standard React Native dependency
    implementation("com.facebook.react:react-native")

    // Example library usage
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}